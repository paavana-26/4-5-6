name: Python Calculator CI
on: [push]

jobs:
  test-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Pytest
        run: |
          pip install pytest

      - name: Run Advanced Calculator Tests
        run: pytest test_calc.py
